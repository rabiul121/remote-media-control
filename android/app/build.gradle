plugins { id 'com.android.application' }

android {
    namespace 'com.remotemedia.control'
    compileSdk 35

    defaultConfig {
        applicationId 'com.remotemedia.control'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
