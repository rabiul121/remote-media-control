<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d13"><title>Pair RemoteDeck</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d13;color:#f0f2fa;font:15px 'Segoe UI',sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(470px,100%);padding:28px;border:1px solid #292f3d;border-radius:22px;background:#141823;text-align:center;box-shadow:0 20px 60px #0006}.brand{font:700 12px 'Consolas',monospace;letter-spacing:.13em;color:#c9f36b}.brand span{color:#a1a8b9}h1{font-size:26px;margin:25px 0 8px}.lead{color:#9aa2b4;line-height:1.55;margin:0 auto 20px;max-width:350px}.qr{display:grid;place-items:center;width:min(320px,100%);aspect-ratio:1;margin:22px auto 17px;padding:13px;border-radius:17px;background:white}.qr svg{width:100%;height:100%}.details{color:#c9f36b;font:13px 'Consolas',monospace;word-break:break-word}.status{min-height:20px;color:#ff8a72;font-size:13px;margin-top:12px}.hint{color:#767f92;font-size:12px;line-height:1.5;margin:20px 0 0}.btn{margin-top:14px;padding:9px 13px;border:1px solid #343b4c;border-radius:10px;background:#1b202b;color:#d9deea;cursor:pointer}.hidden{display:none}
</style></head><body><main class="card"><div class="brand">REMOTE<span> / DECK</span></div><h1>Scan to connect</h1><p class="lead">Open RemoteDeck on Android and tap <b>Scan pairing QR</b>. Keep both devices on the same Wi-Fi network.</p><div class="qr" id="qr"><span style="color:#20242c">Loading QR…</span></div><div class="details" id="address"></div><div class="status" id="status"></div><button class="btn hidden" id="retry">Try again</button><p class="hint">This QR is available on this Windows PC only. Pairing uses your temporary six-digit host code.</p></main><script>
async function load(){const status=document.querySelector('#status'),box=document.querySelector('#qr'),retry=document.querySelector('#retry');retry.classList.add('hidden');status.textContent='';try{const r=await fetch('/api/pair-qr',{cache:'no-store'}),data=await r.json();if(!r.ok)throw new Error(data.error||'Could not create pairing QR.');box.innerHTML=data.svg;document.querySelector('#address').textContent=data.host+':'+data.port;}catch(e){box.innerHTML='<span style="color:#20242c">QR unavailable</span>';status.textContent=e.message;retry.classList.remove('hidden')}}document.querySelector('#retry').addEventListener('click',load);load();
</script></body></html>
